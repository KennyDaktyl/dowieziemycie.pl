services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dowieziemycie}
      POSTGRES_USER: ${POSTGRES_USER:-dowieziemycie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dowieziemycie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dowieziemycie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    # runserver (not daphne) in dev: channels patches it to also serve the
    # tracking WebSocket, and it autoreloads on code changes.
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      # Named volume so the container's own (Linux, uv-synced) venv isn't
      # shadowed by the host bind mount above — same reasoning as the
      # frontend's node_modules volume below.
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

  # Self-hosted routing/ETA engine (Phase 4). Not started by a plain
  # `docker compose up` — requires a prepared .osrm dataset first, see
  # docs/ for the extract/partition/customize steps once we get there.
  osrm:
    image: osrm/osrm-backend
    profiles: ["tracking"]
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/malopolska-latest.osrm
    ports:
      - "5001:5000"

volumes:
  postgres_data:
  frontend_node_modules:
  backend_venv:
