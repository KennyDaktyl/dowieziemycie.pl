[project]
name = "dowieziemycie-backend"
version = "0.1.0"
description = "dowieziemycie.pl backend — Django + DRF + Channels"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17,<3.18",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "django-cors-headers>=4.9,<4.10",
    "channels>=4.3,<4.4",
    "channels-redis>=4.3,<4.4",
    "daphne>=4.2,<4.3",
    "psycopg2-binary>=2.9,<2.10",
    "Pillow>=12.3,<13",
    "python-dotenv>=1.2,<2",
    "requests>=2.31,<3",
    "stripe>=15.4.0",
]

[tool.uv]
package = false
