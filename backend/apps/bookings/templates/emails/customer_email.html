<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ heading }}</title>
</head>
<body style="margin:0; padding:0; background-color:{{ bg_color }}; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:{{ bg_color }}; padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:{{ panel_color }}; border-radius:12px; overflow:hidden;">
<tr>
<td style="background-color:{{ accent_color }}; padding:20px 28px;">
<a href="{{ site_url }}" style="color:{{ accent_text_color }}; text-decoration:none; font-size:20px; font-weight:700;">{{ logo_text }}</a>
<div style="color:{{ accent_text_color }}; opacity:0.85; font-size:12px; margin-top:2px;">{{ tagline }}</div>
</td>
</tr>
<tr>
<td style="padding:28px;">
<h1 style="margin:0 0 16px; color:{{ text_color }}; font-size:20px; line-height:1.3;">{{ heading }}</h1>
{% for line in body_lines %}
<p style="margin:0 0 12px; color:{{ text_color }}; font-size:15px; line-height:1.55;">{{ line }}</p>
{% endfor %}
{% if cta_url %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:20px;">
<tr><td style="border-radius:8px; background-color:{{ accent_color }};">
<a href="{{ cta_url }}" style="display:inline-block; padding:12px 24px; color:{{ accent_text_color }}; text-decoration:none; font-weight:600; font-size:15px; border-radius:8px;">{{ cta_label }}</a>
</td></tr>
</table>
{% endif %}
</td>
</tr>
<tr>
<td style="padding:20px 28px; border-top:1px solid {{ muted_color }}22;">
<p style="margin:0; color:{{ muted_color }}; font-size:12px; line-height:1.5;">
{{ logo_text }} &middot; <a href="{{ site_url }}" style="color:{{ muted_color }};">{{ site_url_display }}</a>
</p>
</td>
</tr>
</table>
</td></tr>
</table>
</body>
</html>
